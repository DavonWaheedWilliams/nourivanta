name: NouriVanta CI

on:
push:
branches: [main]
pull_request:
branches: [main]

permissions:
contents: read

jobs:
api-tests:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4
- uses: actions/setup-python@v5
with:
python-version: '3.12'
cache: pip
- run: pip install -r api/requirements-dev.txt
- run: python -m compileall -q api
- run: pytest -q api/tests

  mobile-typecheck:
runs-on: ubuntu-latest
defaults:
run:
working-directory: mobile
steps:
- uses: actions/checkout@v4
- uses: actions/setup-node@v4
with:
node-version: '22.16.0'
- run: npm install
- run: npm run typecheck
- run: npx expo-doctor
