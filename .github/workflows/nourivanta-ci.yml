name: NouriVanta CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install API test dependencies
        run: pip install -r api/requirements-dev.txt

      - name: Compile API
        run: python -m compileall -q api

      - name: Run API tests
        run: pytest -q api/tests

  mobile-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Install mobile dependencies
        run: npm install

      - name: Type check
        run: npm run typecheck

      - name: Expo doctor
        run: npx expo-doctor
