[theme]
base = "dark"
primaryColor = "#7C6CFF"
backgroundColor = "#0B1120"
secondaryBackgroundColor = "#121C30"
textColor = "#EEF3FF"
font = "sans serif"

[runner]
magicEnabled = false

[server]
headless = true
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 25

[browser]
gatherUsageStats = false
